name: Deploy to Google Cloud Run

# Started by hand once infra/gcp has been applied. See "Running on Google Cloud" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'me-central2' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: petclinic

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Sign in to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Native Buildpacks
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/petclinic/petclinic:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          ./mvnw -B -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName="${IMAGE}"

      - name: Push image to Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "${IMAGE}"

      - name: Deploy new revision
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE}" \
            --quiet
          gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" \
            --format 'value(status.url)'
